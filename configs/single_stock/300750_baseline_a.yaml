# Phase S1 Baseline A: Current production params for 300750
# MACD 10,26,8 + stop_loss 8% + profit_lock 8%/4%
paths:
  duckdb_path: data/market.duckdb
  output_dir: data/output
  logs_dir: data/logs
  stock_name_cache: data/stock_names.csv

trend_signal:
  mode: macd_cross
  macd_fast: 10
  macd_slow: 26
  macd_signal: 8
  min_run_len: 1

signal_filter:
  volume_confirm: true
  volume_lookback: 20
  volume_ratio_min: 1.0

backtest:
  cost_bps: 15.0
  initial_capital: 100000
  execution: tplus1_open
  stop_loss_pct: 0.08
  trailing_stop_pct: 0.0
  atr_trailing_mult: 0.0
  atr_trailing_min_gain: 0.0
  intrapos_dd_limit: 0.0
  profit_lock_trigger: 0.08
  profit_lock_trailing: 0.04
  time_stop_days: 30
  time_stop_min_return: 0.03
  market_exit_mode: 'off'
  transaction_cost:
    commission_buy_bps: 2.5
    commission_sell_bps: 2.5
    slippage_bps_per_side: 2.0
    stamp_duty_sell_bps: 5.0

risk:
  enable_index_filter: false
