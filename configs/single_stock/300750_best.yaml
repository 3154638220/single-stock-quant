# Phase S5: Final optimized config for 300750 (宁德时代)
# R10 S2-S4 experimental results (2026-05-19):
#
# S2-A: MACD (14/26/10) is the best signal type
#   IS (2018-2023): Ann 11.3%, MDD 45.9%, Calmar 0.24
#   OOS (2024-2026): Ann 31.5%, MDD 25.4%, Calmar 1.24
#
# S3-A: ATR trailing (mult=2.5, min_gain=0.10) beats profit_lock
#   Full: Ann 43.8%, MDD 45.3%, Calmar 0.97, 46 trades
#   T3 (2019-2020): Ann 120.1%, Calmar 4.57
#   T4 (2021-2022): Ann +7.1%, Calmar 0.18
#
# S3-B: Regime gate (MA20/40) reduces MDD 27.5% but cuts Ann to 20.1%
#   Hybrid approach: gate only during bear periods achieves median Calmar 1.28
#
# S4 WFO: 3-fold OOS median Calmar 0.82 (no gate), 1.28 (hybrid gate)
#   Bootstrap P(Calmar>=1.0): 61.3%
#   Cost sensitivity (25bps): Calmar 0.93
#
# Decision: Deploy WITHOUT regime gate in observation mode (paper trading).
# Regime gate is available (set regime_gate_enabled: true) for risk-averse operation.

paths:
  duckdb_path: data/market.duckdb
  output_dir: data/output
  logs_dir: data/logs
  stock_name_cache: data/stock_names.csv

trend_signal:
  mode: macd_cross
  macd_fast: 14
  macd_slow: 26
  macd_signal: 10
  min_run_len: 1

signal_filter:
  volume_confirm: true
  volume_lookback: 20
  volume_ratio_min: 1.0

backtest:
  cost_bps: 15.0
  initial_capital: 100000
  execution: tplus1_open
  stop_loss_pct: 0.08
  trailing_stop_pct: 0.0
  atr_trailing_mult: 2.5
  atr_trailing_min_gain: 0.10
  intrapos_dd_limit: 0.0
  profit_lock_trigger: 0.0
  profit_lock_trailing: 0.0
  time_stop_days: 30
  time_stop_min_return: 0.03
  market_exit_mode: 'off'
  transaction_cost:
    commission_buy_bps: 2.5
    commission_sell_bps: 2.5
    slippage_bps_per_side: 2.0
    stamp_duty_sell_bps: 5.0

risk:
  enable_index_filter: false
  regime_gate_enabled: false
  regime_ma_fast: 20
  regime_ma_slow: 40
