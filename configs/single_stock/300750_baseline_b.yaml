# Phase S1 Baseline B: 000783-best config ported to 300750
# DKTrend (eastmoney_dkbar) + ATR trailing 2.5x + intrapos_dd 0.05
paths:
  duckdb_path: data/market.duckdb
  output_dir: data/output
  logs_dir: data/logs
  stock_name_cache: data/stock_names.csv

trend_signal:
  mode: eastmoney_dkbar
  bar_period: 5
  bar_method: wma
  bar_color_method: price_change
  bar_color_hold_days: 3
  bar_color_min_red_run: 2
  state_confirm_days: 2
  min_run_len: 1

signal_filter:
  volume_confirm: true
  volume_lookback: 20
  volume_ratio_min: 1.0

backtest:
  cost_bps: 15.0
  initial_capital: 100000
  execution: tplus1_open
  stop_loss_pct: 0.08
  trailing_stop_pct: 0.0
  atr_trailing_mult: 2.5
  atr_trailing_min_gain: 0.08
  intrapos_dd_limit: 0.05
  profit_lock_trigger: 0.0
  profit_lock_trailing: 0.0
  time_stop_days: 45
  time_stop_min_return: 0.02
  market_exit_mode: 'off'
  transaction_cost:
    commission_buy_bps: 2.5
    commission_sell_bps: 2.5
    slippage_bps_per_side: 2.0
    stamp_duty_sell_bps: 5.0

risk:
  enable_index_filter: false
