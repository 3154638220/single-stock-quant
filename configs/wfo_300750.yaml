# WFO constraints for 300750 (CATL).
# Adds sector-level ETF exit to cut industry drawdowns before price-only stops
# can react.

paths:
  output_dir: data/output/experiments/plan_05_19

backtest:
  stop_loss_pct: 0.08
  time_stop_days: 30
  time_stop_min_return: 0.03
  market_exit_mode: sector
  sector_index_symbol: "515030"
  sector_drop_threshold: 0.10
  sector_ma_period: 20
  dk_fade_exit_n: 0

signal_filter:
  volume_confirm: true

wfo:
  train_days: 504
  oos_days: 126
  step_days: 126
  min_trades_per_year: 2.0
  max_trades_per_year: 30.0
  max_drawdown_limit: 0.25
  n_jobs: 4
  param_grid:
    macd_fast: [8, 10, 12, 14]
    macd_slow: [22, 26, 30]
    macd_signal: [7, 8, 9, 10]
    min_run_len: [1, 2]
    profit_lock_trigger: [0.10, 0.12, 0.15]
    profit_lock_trailing: [0.04, 0.05, 0.06]
    sector_drop_threshold: [0.08, 0.10, 0.12]
    require_above_ma120: [true, false]
    require_positive_rs60: [true, false]
    require_adx_min: [0, 18, 22, 26]
    adx_period: [14]
    atr_trailing_mult: [0, 1.5, 2.0, 2.5, 3.0]
    atr_trailing_min_gain: [0.03, 0.05, 0.08]
    intrapos_dd_limit: [0, 0.12, 0.15, 0.18]
  fast_grid:
    macd_fast: [12]
    macd_slow: [26]
    macd_signal: [9]
    min_run_len: [1, 2]
    profit_lock_trigger: [0.12]
    profit_lock_trailing: [0.05]
    sector_drop_threshold: [0.10]
    require_above_ma120: [true, false]
    require_positive_rs60: [true, false]
    require_adx_min: [0, 22]
    adx_period: [14]
    atr_trailing_mult: [0, 2.0]
    atr_trailing_min_gain: [0.05]
    intrapos_dd_limit: [0, 0.15]
