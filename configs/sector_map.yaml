# L-2-A: Differentiated market-regime exit thresholds per sector.
# Defensive sectors (银行, 乳业, 电力) use higher thresholds = exit only in
# extreme bear markets. Cyclical sectors (新能源) use lower thresholds for
# faster exit protection.
regime_thresholds:
  新能源: 0.05       # exit at 5% index drawdown (same as global)
  银行: 0.15         # exit only at 15% index drawdown (defensive)
  白酒: 0.10
  乳业: 0.15
  电力: 0.20         # stable cash flows, exit only in extreme conditions
  工业自动化: 0.10
  医药器械: 0.10
  水泥: 0.15         # defensive infrastructure
  旅游: 0.10
