# Industry sector mapping for rotation pool stocks.
# Used by the sector concentration constraint (P2-B).
# X3 pool: 300750/002594 grouped as 新能源 to prevent dual selection.

sectors:
  新能源:
    - "300750"   # 宁德时代
    - "002594"   # 比亚迪
  新能源光伏:
    - "601012"
  能源:
    - "601857"
    - "601088"
  白酒:
    - "000858"   # 五粮液
    - "600519"   # 贵州茅台
    - "600809"
    - "000568"
    - "002304"   # 洋河股份
  银行:
    - "600036"   # 招商银行
    - "601166"
  证券:
    - "600030"
  保险:
    - "601318"
  医药:
    - "603259"
  电子制造:
